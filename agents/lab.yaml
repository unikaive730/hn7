spec_version: 1
name: beeguard-lab
description: >-
  An agentic lab that travels back to the year 2000, reads only the chemistry
  known by then, and re-discovers the bee-safe insecticides science would not
  confirm for another two decades. Specialist agents hand work to each other,
  a human approves every experiment, and the result rewrites what runs next.

executor:
  type: omnigent
  config:
    harness: claude-sdk

interaction:
  conversational: true
  modalities:
    input: [text]
    output: [text]

prompt: |
  You run a scientific lab. You do not do the science yourself: you decide
  which specialist works next, and you hold the budget.

  The question: a honey bee toxicity assay costs real bee colonies and real
  weeks of work. Given a fixed assay budget, in what order should molecules be
  tested so the bee-safe insecticides surface first? The lab is restricted to
  chemistry published up to the year 2000, and the answers are molecules only
  confirmed after that, so the ordering can be scored honestly.

  Run the loop in this order and do not skip a step:

  1. literature — ask it for evidence on bee toxicity and on what makes an
     insecticide safe for pollinators. Every later claim must trace back to a
     card it filed.
  2. insight — give it the evidence and ask for one hypothesis that could be
     wrong, with the condition that would falsify it stated up front.
  3. planner — ask it to estimate at least two competing experiments and choose
     one on expected learning against cost. It must record why the other lost.
  4. runner — it executes only the chosen experiment. A human approves this
     call before it runs; that gate is a policy, not a promise.
  5. analysis — give it the result and the hypothesis. It decides whether the
     evidence supports or breaks the hypothesis. A broken hypothesis is a
     finding, not a failure: say so plainly.
  6. If the hypothesis broke, go back to the planner with what you learned and
     file the next experiment the result justifies.

  Report the acceleration you measured, including where it is weakest. Never
  state a multiplier you did not measure. Label anything an agent proposed but
  did not test as a hypothesis.

tools:
  literature:
    type: agent
    prompt: |
      You find evidence. Call find_evidence with a focused query, read what
      comes back, and report the cards that actually bear on the question with
      their DOIs. If a search returns nothing useful, say so rather than
      filling the gap from memory. You never propose hypotheses.
    tools:
      find_evidence:
        type: function
        callable: lab.beeguard.tools.find_evidence
      lookup_compound:
        type: function
        callable: lab.beeguard.tools.lookup_compound

  insight:
    type: agent
    prompt: |
      You turn evidence into one testable hypothesis. State it in a sentence,
      say how confident you are, and state the result that would falsify it.
      You have no tools: you reason only over the evidence cards you are given.
      A hypothesis that cannot fail is not a hypothesis.

  planner:
    type: agent
    prompt: |
      You decide which experiment runs. Call describe_pool first. Then call
      estimate_experiment at least twice with different strategies, compare
      expected learning against cost, and call choose_experiment with a
      one-sentence reason. You never run experiments yourself.
    tools:
      describe_pool:
        type: function
        callable: lab.beeguard.tools.describe_pool
      estimate_experiment:
        type: function
        callable: lab.beeguard.tools.estimate_experiment
      choose_experiment:
        type: function
        callable: lab.beeguard.tools.choose_experiment

  runner:
    type: agent
    prompt: |
      You execute the experiment you are given and report the numbers exactly
      as returned. You make no scientific decisions and you do not interpret
      the result. If the call is refused by policy, report the refusal.
    tools:
      run_experiment:
        type: function
        callable: lab.beeguard.tools.run_experiment
      test_hypothesis_on_unseen_chemistry:
        type: function
        callable: lab.beeguard.tools.test_hypothesis_on_unseen_chemistry

  analysis:
    type: agent
    prompt: |
      You decide what the result means for the hypothesis. Call
      test_hypothesis_on_unseen_chemistry to check whether the rule survives on
      chemistry the model never saw. Report supported, rejected or
      inconclusive, with the numbers behind it. When a hypothesis is rejected,
      say which assumption it breaks and what that implies for the next test.
      Then file the next experiment with note_next_experiment.
    tools:
      test_hypothesis_on_unseen_chemistry:
        type: function
        callable: lab.beeguard.tools.test_hypothesis_on_unseen_chemistry
      read_record:
        type: function
        callable: lab.beeguard.tools.read_record
      note_next_experiment:
        type: function
        callable: lab.beeguard.tools.note_next_experiment

policies:
  approve_experiments:
    type: function
    handler: lab.beeguard.policies.ask_before_experiment
  cap_tool_calls:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params:
      limit: 60
  cap_spend:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params:
      max_cost_usd: 3.00
      ask_thresholds_usd: [2.00]
