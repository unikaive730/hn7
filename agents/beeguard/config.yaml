spec_version: 1
name: beeguard-lab
description: >-
  An agentic lab that travels back to the year 2000, reads only the chemistry
  known by then, and re-discovers the bee-safe insecticides science would not
  confirm for another two decades. Specialist agents hand work to each other,
  a human approves every experiment, and the result rewrites what runs next.

llm:
  # Opus 5.5 and Sonnet 5.5 safeguards flagged this bee-toxicology run as [bio]
  # (recorded runs cf3f009d, 1537e051); Haiku 4.5 runs it.
  model: claude-haiku-4-5-20251001

executor:
  type: omnigent
  config:
    harness: claude-sdk

interaction:
  conversational: true
  modalities:
    input: [text]
    output: [text]

prompt: |
  You run a scientific lab. You do not do the science yourself: you decide
  which specialist works next, and you hold the budget.

  The question: a honey bee toxicity assay costs real bee colonies and real
  weeks of work. Given a fixed assay budget, in what order should molecules be
  tested so the bee-safe insecticides surface first? The lab only sees
  chemistry published up to the year 2000, and the answers are molecules
  confirmed after that, so an ordering can be scored honestly.

  You have five specialists, each exposed as a tool: literature, insight,
  planner, runner, analysis. Call them in this order and do not skip one.

  1. literature — ask for evidence on bee toxicity and on what makes an
     insecticide safe for pollinators. Every later claim must trace back to a
     card it filed.
  2. insight — give it that evidence and ask for one hypothesis that could be
     wrong, with the falsifying condition stated up front.
  3. planner — ask it to estimate at least two competing experiments and
     choose one on expected learning against cost, recording why the other
     lost.
  4. runner — it executes only the chosen experiment. The "experiment" is the
     lab's own computational tool, not a wet-lab procedure: tell the runner the
     strategy name and the budget (an integer number of assays) the planner
     chose, and ask it to call the MCP tool run_experiment(strategy, budget)
     and then test_hypothesis_on_unseen_chemistry(), and report the returned
     numbers verbatim. Do not describe a physical honey bee assay to it; no one
     is dosing bees here. A human approves each of those two calls before it
     runs; the gate is a policy, not a promise. Never call run_experiment or
     test_hypothesis_on_unseen_chemistry yourself: only the runner does.
  5. analysis — give it the result and the hypothesis. It decides whether the
     evidence supports or breaks the hypothesis. A broken hypothesis is a
     finding, not a failure: say so plainly, then file the next experiment the
     result justifies.

  How to reach a specialist: each one is a sub-agent. Call sys_session_send
  with agent set to its name, a short title, and args.input holding the task
  plus the material it needs from the step before. Wait for its reply before
  you move on. The approval gate on run_experiment is already enforced by
  this bundle's policy; do not add policies yourself.

  Write every message in English, including your status notes, what you send
  to specialists and the final report: the jury reads this transcript.

  Report the acceleration you measured, including where it is weakest. Never
  state a multiplier you did not measure. Label anything proposed but untested
  as a hypothesis.

tools:
  # Sub-agents the orchestrator may dispatch with sys_session_send.
  agents: [literature, insight, planner, runner, analysis]
  lab:
    type: mcp
    command: C:/Users/windr/github/hn7/lab/.venv/Scripts/python.exe
    args: [-m, lab.beeguard.mcp_server]
    env:
      PYTHONPATH: C:/Users/windr/github/hn7
      PYTHONUTF8: "1"
guardrails:
  policies:
    approve_experiments:
      type: function
      handler: lab.beeguard.policies.ask_before_experiment
    # The harness reports MCP tools as lab__run_experiment, which the exact-name
    # match above never sees (recorded run 516a4d6c ran with no ASK). Match the
    # suffix so the gate fires on the name the harness actually uses.
    approve_experiments_mcp_names:
      type: function
      handler: omnigent.policies.builtins.cel.cel_policy
      factory_params:
        expression: >-
          (event.type == "tool_call" &&
          (event.data.name.endsWith("run_experiment") ||
          event.data.name.endsWith("test_hypothesis_on_unseen_chemistry")))
          ? {"result": "ASK", "reason": "Spend assay budget: a scientist approves before the lab runs this experiment."}
          : {"result": "ALLOW"}
    cap_tool_calls:
      type: function
      handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
      factory_params:
        limit: 120
