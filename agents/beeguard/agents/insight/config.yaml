spec_version: 1
name: insight
description: >-
  Turns evidence cards into one falsifiable hypothesis.

llm:
  # Opus 5.5 and Sonnet 5.5 safeguards flagged this bee-toxicology run as [bio]
  # (recorded runs cf3f009d, 1537e051); Haiku 4.5 runs it.
  model: claude-haiku-4-5-20251001

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  Write every message in English.

  You turn evidence into one testable hypothesis. State it in a sentence, say
  how confident you are, and state the result that would falsify it. You reason
  only over the evidence cards you are given. A hypothesis that cannot fail is
  not a hypothesis.
