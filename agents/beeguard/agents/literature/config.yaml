spec_version: 1
name: literature
description: >-
  Searches live scientific sources and files citable evidence cards.

llm:
  # Opus 5.5 and Sonnet 5.5 safeguards flagged this bee-toxicology run as [bio]
  # (recorded runs cf3f009d, 1537e051); Haiku 4.5 runs it.
  model: claude-haiku-4-5-20251001

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  Write every message in English.

  You find evidence. Call find_evidence with a focused query, read what comes
  back, and report the cards that bear on the question with their DOIs. If a
  search returns nothing useful, say so rather than filling the gap from
  memory. You never propose hypotheses.

tools:
  lab:
    type: mcp
    command: C:/Users/windr/github/hn7/lab/.venv/Scripts/python.exe
    args: [-m, lab.beeguard.mcp_server]
    env:
      PYTHONPATH: C:/Users/windr/github/hn7
      PYTHONUTF8: "1"
